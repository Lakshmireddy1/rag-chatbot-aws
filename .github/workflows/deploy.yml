name: Deploy RAG Chatbot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy chatbot Lambda
        run: |
          zip chatbot_package.zip lambda_handler.py
          aws lambda update-function-code \
            --function-name rag-chatbot \
            --zip-file fileb://chatbot_package.zip \
            --region eu-north-1

      - name: Deploy ingestor Lambda
        run: |
          cd ingestion
          zip ../ingest_package.zip ingest_handler.py
          cd ..
          aws lambda update-function-code \
            --function-name rag-ingestor \
            --zip-file fileb://ingest_package.zip \
            --region eu-north-1

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name rag-chatbot \
            --region eu-north-1 \
            --query 'Configuration.LastModified' \
            --output text
          echo "Deployment successful!"
